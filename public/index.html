<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>残業ゲーム</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f5;--ink:#222;--acc:#f2b705;--felt:#34495e}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--ink:#eee}}
:root[data-theme="dark"]{--bg:#14171a;--ink:#eee}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:8px 12px;box-sizing:border-box}
h1{font-size:20px;margin:6px 0 8px;text-align:center}
.felt{background:radial-gradient(circle at 50% 40%,#46627f,var(--felt));border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px;color:#fff}
.nm{font-size:14px;margin-bottom:6px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:4px}
.b{width:26px;height:40px;border-radius:5px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#7a2b2b,#7a2b2b 4px,#a03a3a 4px,#a03a3a 8px);padding:0}
.b.t{cursor:pointer;border-color:var(--acc);animation:p 1s infinite}
.b.h{transform:translateY(-8px);box-shadow:0 0 0 3px var(--acc)}
@keyframes p{50%{transform:translateY(-3px)}}
.c{width:54px;height:66px;border-radius:6px;background:#fff;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 3px #0005}
.c i{font-style:normal;font-size:24px}.c small{font-size:9px;font-weight:700;white-space:nowrap}
.c.joker{background:#ffd9d9}
.c.h{transform:translateY(-8px);box-shadow:0 0 0 3px var(--acc)}
#msg{margin:0;text-align:center;min-height:3em;font-size:15px;font-weight:600}
#act{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:8px}
button.go{font-size:14px;padding:8px 14px;border:0;border-radius:999px;background:var(--acc);color:#222;font-weight:700}
details{margin:10px 0;font-size:13px;line-height:1.6}summary{cursor:pointer;font-weight:700}
#end{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
#end[hidden]{display:none}
#end div{background:var(--bg);color:var(--ink);padding:24px;border-radius:16px;text-align:center;font-size:18px;font-weight:700}
#res{white-space:pre-line}

[hidden]{display:none!important}
.hero{text-align:center;padding:28px 8px}.hero .big{font-size:64px}.hero h2{font-size:28px;margin:8px 0}.hero p{margin:6px 0 18px;opacity:.8;font-size:14px}
.hero button{display:block;width:100%;max-width:300px;margin:10px auto;font-size:17px;padding:14px}
#plist{list-style:none;padding:0;margin:8px 0;font-size:16px}#plist li{padding:6px 0;border-bottom:1px solid #fff3}
#opp{display:flex;flex-direction:column;gap:10px}#pv{font-size:12px;opacity:.9;min-height:1em}
.sub{font-size:12px;opacity:.75}
.fan{position:relative;height:150px;margin-top:4px}
.fan .c{position:absolute;left:50%;top:22px;margin-left:-27px;width:54px;height:66px;box-sizing:border-box;transform-origin:50% 240px;transform:rotate(var(--r));transition:transform .15s;align-items:flex-start;justify-content:flex-start;padding:4px 0 0 5px}
.fan .c small{margin-top:2px}
.fan .c:hover{z-index:99!important;transform:rotate(var(--r)) translateY(-20px)}
.fan .c.h{transform:rotate(var(--r)) translateY(-16px);box-shadow:0 0 0 3px var(--acc)}
#info{font-size:13px;background:#0003;border-radius:8px;padding:6px 10px;min-height:2.6em;line-height:1.4}
#log{max-height:150px;overflow-y:auto;font-size:12.5px;line-height:1.6;border:1px solid #8884;border-radius:8px;padding:6px 8px;margin-top:4px}
#end .go{margin:14px 6px 0}

.hero input{display:block;width:100%;max-width:300px;box-sizing:border-box;margin:8px auto;padding:12px;font-size:16px;border-radius:10px;border:1px solid #8886;background:transparent;color:inherit;text-align:center}
.hero .join{display:flex;gap:8px;max-width:300px;margin:10px auto}.hero .join input{margin:0;text-transform:uppercase}.hero .join button{width:auto;margin:0;padding:0 18px}
#code{font-size:36px;letter-spacing:6px;font-weight:800;text-align:center;margin:4px 0}
</style></head><body>
<main>
<section id="open" class="hero">
<div class="big">💼</div><h2>残業ゲーム</h2>
<p>残業😈を押し付け合う、ババ抜きベースのカードゲーム</p>
<input id="nm" maxlength="12" placeholder="なまえ">
<button class="go" id="bsolo">ひとりで遊ぶ(CPU対戦)</button>
<button class="go" id="bcre">ルームを作って友達と遊ぶ</button>
<div class="join"><input id="cd" maxlength="4" placeholder="ルームコード"><button class="go" id="bjoin">参加</button></div>
<p id="onote" class="sub"></p>
</section>
<section id="lobby" class="felt" hidden>
<div class="nm">ルームコード</div><div id="code"></div>
<div style="text-align:center"><button class="go" id="bcopy">招待リンクをコピー</button></div>
<ul id="plist"></ul><p id="lnote"></p>
<p class="sub">3人に満たない分はCPUが入ります(最大6人)。</p>
<div style="display:flex;gap:8px;justify-content:center"><button class="go" id="bs">ゲーム開始</button><button class="go" id="bback">やめる</button></div>
</section>
<section id="game" class="felt" hidden>
<div id="opp"></div><p id="msg" aria-live="polite"></p><div id="act"></div><div id="me"></div><div id="pv"></div><div id="info"></div>
</section>
<details id="logd" open hidden><summary>行動ログ</summary><div id="log"></div></details>
<details><summary>ルール・カード効果</summary><div id="rules"></div></details>
</main>
<div id="end" hidden><div><span id="res"></span><br><button class="go" id="again"></button><button class="go" id="home">オープニングに戻る</button></div></div>
<script>
let T=[],V=null,sess=null,es=null,sent='',lastKey='',stick='手札にカーソルを合わせる(スマホはタップ)と効果が表示されます';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{sess=JSON.parse(localStorage.getItem('zg'))}catch(e){}
$('nm').value=localStorage.getItem('zname')||'';
async function api(p,b){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return await r.json()}catch(e){return{error:'通信に失敗しました'}}}
const act=(type,x={})=>api('act',{room:sess.room,pid:sess.pid,token:sess.token,type,...x});
fetch('/cards.json').then(r=>r.json()).then(t=>{T=t;
$('rules').innerHTML='<b>ババ抜き+特殊効果(49枚)</b><br>・自分の番: 次の人の手札から1枚引く → 同じカードが2枚そろっていれば1ペアだけ出して効果を発動できる<br>・手札がなくなったら定時退社(上がり)<br>・最後まで残業😈を持っていた人、または労基で残業を暴かれた人の負け<br><br>'+T.map(t=>`${t.e}<b>${t.n}</b>(${t.c}枚): ${t.d}`).join('<br>');
const q=new URLSearchParams(location.search).get('room');if(q)$('cd').value=q.toUpperCase();
if(sess)connect()});
function connect(){
if(es)es.close();
es=new EventSource(`/api/events?room=${sess.room}&pid=${sess.pid}&token=${sess.token}`);
es.onmessage=e=>{V=JSON.parse(e.data);render()};
es.addEventListener('gone',()=>{es.close();es=null;reset();$('onote').textContent='ルームが見つかりません(終了した可能性があります)'})}
function reset(){sess=null;V=null;localStorage.removeItem('zg');history.replaceState(null,'',location.pathname);render()}
async function enter(p,b){
const name=$('nm').value.trim()||'プレイヤー';localStorage.setItem('zname',name);
const r=await api(p,{...b,name});
if(r.error){$('onote').textContent=r.error;return false}
sess=r;localStorage.setItem('zg',JSON.stringify(r));history.replaceState(null,'','?room='+r.room);connect();return true}
$('bcre').onclick=()=>enter('create',{});
$('bjoin').onclick=()=>enter('join',{room:$('cd').value.trim().toUpperCase()});
$('bsolo').onclick=async()=>{if(await enter('create',{}))act('start')};
$('bcopy').onclick=()=>{const l=location.origin+'/?room='+sess.room;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>$('bcopy').textContent='コピーしました ✓',()=>prompt('招待リンク',l))};
$('bs').onclick=()=>act('start');
$('bback').onclick=async()=>{await act('leave');if(es)es.close();reset()};
$('again').onclick=()=>{if(V&&V.host==V.me)act('start')};
$('home').onclick=async()=>{await act('leave');if(es)es.close();reset()};
function view(){return!V?'open':V.ph=='lobby'?'lobby':'game'}
function render(){const v=view();['open','lobby','game'].forEach(x=>$(x).hidden=x!=v);
$('logd').hidden=v!='game';$('end').hidden=!(v=='game'&&V.ph=='over');
if(v=='lobby')rLobby();if(v=='game')rGame()}
function rLobby(){
$('code').textContent=V.code;
$('plist').innerHTML=V.lobby.map(x=>`<li>${x.id==V.host?'👑':'👤'} ${esc(x.name)}${x.id==V.me?'(あなた)':''}${x.on?'':' ⚠切断中'}</li>`).join('');
const c=Math.max(0,3-V.lobby.length),isH=V.host==V.me;
$('lnote').textContent=`参加者${V.lobby.length}人`+(c?` + CPU${c}人で開始します`:'で開始します');
$('bs').hidden=!isH;if(!isH)$('lnote').textContent+=' / ホストの開始を待っています'}
function rGame(){
const me=V.mi,pr=V.pr,own=pr&&pr.p==me;
const lab=(p,tail)=>`<div class="nm">${V.turn==p&&V.ph=='play'?'▶ ':''}${esc(V.P[p].name)}${V.P[p].cpu?'(CPU)':''} ${V.out[p]?'🎉定時退社':V.P[p].n+'枚'}${tail}</div>`;
$('opp').innerHTML=V.P.map((x,p)=>p==me?'':'<div>'+lab(p,V.known==p&&!V.out[p]?' 👀残業持ち':'')+'<div class="row">'+
Array.from({length:x.n},(_,i)=>`<button class="b ${own&&pr.from==p?'t':''} ${V.hl&&V.hl.p==p&&V.hl.i==i?'h':''}" data-i="${i}" aria-label="カード"></button>`).join('')+'</div></div>').join('');
const hn=V.hand.length,st=hn>1?Math.min(7,64/(hn-1)):0;
$('me').innerHTML=me<0?'<div class="nm">👀 観戦中</div>':lab(me,'')+'<div class="fan">'+
V.hand.map((c,i)=>`<div class="c ${c.j?'joker':''} ${V.hl&&V.hl.p==me&&V.hl.i==i?'h':''}" data-t="${c.j?-1:c.t}" style="--r:${((i-(hn-1)/2)*st).toFixed(1)}deg;z-index:${i}"><i>${c.j?'😈':T[c.t].e}</i><small>${c.j?'残業':T[c.t].n}</small></div>`).join('')+'</div>';
const L=$('log');L.innerHTML=(V.log||[]).map(x=>`<div>${esc(x)}</div>`).join('');L.scrollTop=L.scrollHeight;
$('pv').textContent=V.pv||'';
$('msg').textContent=own?pr.msg:(V.msg||'')+(pr&&!own?` ⏳${V.P[pr.p].name}の操作待ち`:'');
const key=pr?pr.n+':'+pr.p:'';
if(key!==lastKey){lastKey=key;const a=$('act');a.innerHTML='';
if(own&&pr.opts)pr.opts.forEach((l,i)=>{const b=document.createElement('button');b.className='go';b.textContent=l;b.onclick=()=>{a.innerHTML='';respond(i)};a.appendChild(b)})}
if(V.ph=='over'){$('res').textContent=V.loser==me?'😱 残業確定…あなたの負け!':`🎉 定時退社!\n${V.P[V.loser].name}が残業に…`;
const b=$('again'),h=V.host==V.me;b.disabled=!h;b.textContent=h?'もう一度':'ホストの操作待ち…'}}
function respond(v){const pr=V&&V.pr;if(!pr||pr.p!=V.mi)return;const k=pr.n;if(sent==k)return;sent=k;act('choose',{n:pr.n,v})}
$('opp').onclick=e=>{const b=e.target.closest('.b.t');if(b)respond(+b.dataset.i)};
const infoText=t=>t<0?'😈残業: 最後まで持っていたら負け。労基で暴かれても負け':`${T[t].e}${T[t].n}(${T[t].c}枚): ${T[t].d}`;
$('info').textContent=stick;
$('me').onmouseover=e=>{const c=e.target.closest('.c');if(c)$('info').textContent=infoText(+c.dataset.t)};
$('me').onclick=e=>{const c=e.target.closest('.c');if(c){stick=infoText(+c.dataset.t);$('info').textContent=stick}};
$('me').onmouseleave=()=>$('info').textContent=stick;
</script>
</body></html>
